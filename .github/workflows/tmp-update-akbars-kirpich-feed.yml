name: Temporary Ak Bars brick feed update

on:
  push:
    paths:
      - .github/workflows/tmp-update-akbars-kirpich-feed.yml
  pull_request:
    paths:
      - feed-update-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh brick feed
        run: python scripts/tmp_update_akbars_kirpich_feed.py

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akbars_kirpich_yandex_direct_feed.yml
          if git diff --cached --quiet; then
            echo "Feed is already current"
          else
            git commit -m "Update Ak Bars brick feed"
            git push
          fi
