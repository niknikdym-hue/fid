name: Temporary Ak Bars brick feed update

on:
  push:
    paths:
      - .github/workflows/tmp-update-akbars-kirpich-feed.yml
  pull_request:
    paths:
      - feed-update-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Patch product price extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/tmp_update_akbars_kirpich_feed.py")
          text = path.read_text(encoding="utf-8")
          old = '''    h1 = soup.find("h1")
              root = h1.parent if h1 and h1.parent else soup
              text = clean_text(root.get_text(" ", strip=True))
              match = re.search(r"(?<!\\d)(\\d[\\d\\s]*(?:[.,]\\d{1,2})?)\\s*₽", text)
              if match:
                  return float(match.group(1).replace(" ", "").replace(",", "."))
              return None
          '''
          new = '''    price_pattern = re.compile(r"(?<!\\d)(\\d{1,6}(?:[ \\u00a0]\\d{3})*(?:[.,]\\d{1,2})?)\\s*₽")
              h1 = soup.find("h1")
              if h1:
                  nearby_parts = []
                  for element in h1.next_elements:
                      if isinstance(element, str):
                          token = clean_text(element)
                          if not token:
                              continue
                          if token == "Характеристики":
                              break
                          nearby_parts.append(token)
                          if len(nearby_parts) >= 80:
                              break
                  nearby_text = clean_text(" ".join(nearby_parts))
                  for raw in price_pattern.findall(nearby_text):
                      value = float(raw.replace(" ", "").replace("\\u00a0", "").replace(",", "."))
                      if value > 0:
                          return value

              page_text = clean_text(soup.get_text(" ", strip=True))
              if h1:
                  title = clean_text(h1.get_text(" ", strip=True))
                  if title and title in page_text:
                      page_text = page_text.split(title, 1)[1]
              for raw in price_pattern.findall(page_text):
                  value = float(raw.replace(" ", "").replace("\\u00a0", "").replace(",", "."))
                  if value > 0:
                      return value
              return None
          '''
          if old not in text:
              raise SystemExit("Expected parse_price block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Refresh brick feed
        run: python scripts/tmp_update_akbars_kirpich_feed.py

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akbars_kirpich_yandex_direct_feed.yml
          if git diff --cached --quiet; then
            echo "Feed is already current"
          else
            git commit -m "Update Ak Bars brick feed"
            git push
          fi
