name: Temporary Ak Bars rigel feed generator

on:
  push:
    paths:
      - .github/workflows/tmp-create-akbars-rigel-feed.yml
  pull_request:
    paths:
      - scripts/tmp_create_akbars_rigel_feed.py
      - .github/workflows/tmp-create-akbars-rigel-feed.yml
      - tmp-rigel-feed-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Generate rigel brick feed
        run: python scripts/tmp_create_akbars_rigel_feed.py

      - name: Validate XML and product count
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = "akbars_rigel_kirpich_yandex_direct_feed.yml"
          root = ET.parse(path).getroot()
          offers = root.findall("./shop/offers/offer")
          assert len(offers) == 7, len(offers)
          assert all(o.findtext("categoryId") == "1" for o in offers)
          assert all("блок" not in (o.findtext("name") or "").lower() for o in offers)
          assert all((o.findtext("price") or "").strip() for o in offers)
          print("XML valid; offers:", len(offers))
          PY

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akbars_rigel_kirpich_yandex_direct_feed.yml
          if git diff --cached --quiet; then
            echo "Feed is already current"
          else
            git commit -m "Add Ak Bars rigel brick feed"
            git pull --rebase
            git push
          fi
