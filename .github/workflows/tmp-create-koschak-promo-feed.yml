name: Create Koshchak promo feed

on:
  push:
    branches:
      - main
    paths:
      - scripts/tmp_create_koschak_promo_feed.py
      - .github/workflows/tmp-create-koschak-promo-feed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build promotional feed
        run: python scripts/tmp_create_koschak_promo_feed.py

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'akbars_koschakovskiy_aktsiya_yandex_direct_feed.yml'
          root = ET.parse(path).getroot()
          offers = root.findall('./shop/offers/offer')
          assert root.tag == 'yml_catalog'
          assert len(offers) == 4
          assert [o.findtext('price') for o in offers] == ['25.00', '26.00', '26.00', '27.00']
          assert all(o.findtext('vendor') == 'Кощаковский завод' for o in offers)
          assert all(o.findtext('url') for o in offers)
          print('XML validation passed:', len(offers), 'offers')
          PY

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akbars_koschakovskiy_aktsiya_yandex_direct_feed.yml
          if git diff --cached --quiet; then
            echo "Feed is already current"
          else
            git commit -m "Add Koshchak promotional brick feed"
            git push
          fi
