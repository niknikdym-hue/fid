name: Clean paving Direct feed

on:
  push:
    branches:
      - main
    paths:
      - scripts/tmp_clean_bruschatka_feed.py
      - .github/workflows/tmp-clean-bruschatka-feed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean feed
        run: python scripts/tmp_clean_bruschatka_feed.py
      - name: Commit cleaned feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add akbars_bruschatka_yandex_direct_feed.yml
          if git diff --cached --quiet; then
            echo "Feed already clean"
          else
            git commit -m "Clean Ak Bars paving Direct feed"
            git push
          fi
